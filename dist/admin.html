<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio CMS | Xin Mei</title>
    <meta name="description" content="Local portfolio content editor for Xin Mei.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="admin-page">
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">XM</span>
        <span>Xin Mei CMS</span>
      </a>
      <nav class="nav" aria-label="Admin navigation">
        <a href="index.html">Portfolio</a>
        <button id="reset-cms" class="nav-button" type="button">Reset</button>
      </nav>
    </header>

    <main class="section admin-shell">
      <div class="section-heading">
        <p class="section-label">CMS</p>
        <h1>Update portfolio content.</h1>
      </div>

      <form id="cms-form" class="cms-form">
        <section class="admin-panel">
          <h2>Contact</h2>
          <label>
            Email
            <input name="email" type="email" autocomplete="email">
          </label>
          <label>
            Phone
            <input name="phone" type="tel" autocomplete="tel">
          </label>
          <label>
            Resume link
            <input name="resume" type="url" placeholder="Add later">
          </label>
        </section>

        <section class="admin-panel">
          <div class="admin-panel-heading">
            <h2>Projects</h2>
            <button id="add-project" class="button secondary" type="button">Add project</button>
          </div>
          <div id="project-editor" class="project-editor"></div>
        </section>

        <section class="admin-actions">
          <button class="button primary" type="submit">Save in this browser</button>
          <button id="export-json" class="button secondary" type="button">Export JSON</button>
        </section>
      </form>

      <section class="admin-panel">
        <h2>Import JSON</h2>
        <textarea id="import-json" rows="8" placeholder="Paste exported JSON here"></textarea>
        <button id="import-button" class="button secondary" type="button">Import</button>
      </section>
    </main>

    <script src="data.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
