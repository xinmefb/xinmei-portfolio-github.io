backend:
  name: turbo-github
  turbo_site_id: 6d77c4d2-e204-46c2-98cc-8147b80b7b68
  branch: main

publish_mode: simple
media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "portfolio"
    label: "Portfolio"
    files:
      - name: "content"
        label: "Portfolio Content"
        file: "content/portfolio.json"
        format: "json"
        fields:
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Resume Link", name: "resume", widget: "string", required: false }
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Type", name: "type", widget: "string" }
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Button Label", name: "action", widget: "string", required: false }
              - { label: "Featured", name: "featured", widget: "boolean", default: false }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Bullets"
                name: "bullets"
                widget: "list"
                required: false
                field: { label: "Bullet", name: "bullet", widget: "string" }
